services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reconflow}
      POSTGRES_USER: ${POSTGRES_USER:-reconflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reconflow-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reconflow} -d ${POSTGRES_DB:-reconflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/ReconFlow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=${POSTGRES_DB:-reconflow};Username=${POSTGRES_USER:-reconflow};Password=${POSTGRES_PASSWORD:-reconflow-dev-password}
      Jwt__Key: ${JWT_KEY:-development-only-reconflow-key-change-me-2026}
      Jwt__Issuer: ReconFlow
      Jwt__Audience: ReconFlow.UI
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: frontend/reconflow-ui
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  postgres-data:

